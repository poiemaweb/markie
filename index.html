<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1e293b" />

    <!-- Primary SEO -->
    <title>Markie — Lightweight Markdown Viewer with Mermaid &amp; PDF Export</title>
    <meta
      name="description"
      content="Markie is a free, open-source markdown viewer. Paste, drag, or import markdown text and instantly see it rendered with Mermaid diagrams, syntax highlighting, and one-click export to PDF, PNG, or .md. Web app and macOS / Windows / Linux desktop apps."
    />
    <meta
      name="keywords"
      content="markdown, markdown viewer, markdown renderer, mermaid, mermaid diagrams, markdown to pdf, markdown editor, markdown-it, tauri, desktop app, react, typescript"
    />
    <meta name="author" content="poiemaweb" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://poiemaweb.github.io/markie/" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <!-- Open Graph / Facebook / LinkedIn / KakaoTalk -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Markie" />
    <meta property="og:title" content="Markie — Lightweight Markdown Viewer" />
    <meta
      property="og:description"
      content="Paste markdown, see it rendered with Mermaid + syntax highlighting, export to PDF / PNG / .md. Free, open source, runs in any browser."
    />
    <meta property="og:url" content="https://poiemaweb.github.io/markie/" />
    <meta property="og:image" content="https://poiemaweb.github.io/markie/og-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Markie logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Markie — Lightweight Markdown Viewer" />
    <meta
      name="twitter:description"
      content="Paste markdown, see it rendered with Mermaid + syntax highlighting, export to PDF / PNG / .md. Free, open source."
    />
    <meta name="twitter:image" content="https://poiemaweb.github.io/markie/og-image.png" />
    <meta name="twitter:image:alt" content="Markie logo" />

    <!-- Structured data — SoftwareApplication schema for rich Google results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Markie",
        "description": "Lightweight markdown viewer with Mermaid diagrams, syntax highlighting, and one-click PDF/PNG/MD export. Web app and desktop apps for macOS, Windows, and Linux via Tauri 2.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web, macOS, Windows, Linux",
        "url": "https://poiemaweb.github.io/markie/",
        "downloadUrl": "https://github.com/poiemaweb/markie/releases",
        "softwareVersion": "0.2.0",
        "license": "https://github.com/poiemaweb/markie/blob/main/LICENSE",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Organization",
          "name": "poiemaweb",
          "url": "https://github.com/poiemaweb"
        },
        "codeRepository": "https://github.com/poiemaweb/markie",
        "programmingLanguage": ["TypeScript", "Rust"],
        "featureList": [
          "Markdown rendering with GFM",
          "Mermaid diagram support",
          "Syntax highlighting via highlight.js",
          "Export to PDF (multi-page A4)",
          "Export to PNG",
          "Export to .md file",
          "Light, Dark, and Sepia themes",
          "Keyboard-first workflow",
          "History panel"
        ]
      }
    </script>

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
