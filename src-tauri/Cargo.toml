[package]
name = "markdown-preview-companion"
version = "0.1.0"
description = "Markdown Preview Companion for messenger AI replies"
authors = ["Markdown Preview Companion"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "markdown_preview_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
