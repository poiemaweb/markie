name: Feature request
description: Suggest a new capability or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Markie aims to stay focused — _paste, render, export_. Feature requests that align with that core loop will be prioritized over scope expansion.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user's pain or workflow gap. Avoid jumping to a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could Markie address it? UI sketch, command flow, or behavior description.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or approaches you ruled out and why.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Core (markdown rendering / export)
        - UI / themes
        - Keyboard shortcuts
        - Desktop integration (Tauri tray, global shortcut, IPC)
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
